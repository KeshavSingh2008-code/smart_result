<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white shadow-xl rounded-2xl p-8 text-center max-w-md w-full">

    <!-- Success Icon -->
    <div class="flex justify-center mb-4">
        <div class="bg-green-100 p-4 rounded-full">
            <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor"
                 stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M5 13l4 4L19 7" />
            </svg>
        </div>
    </div>

    <!-- Heading -->
    <h2 class="text-2xl font-bold text-gray-800 mb-2">
        Error
    </h2>



    <!-- Description -->
    <p class="text-gray-600 mb-6">
             Student Roll number not found in database
    </p>

    <!-- Buttons -->
    <div class="flex justify-center gap-4">
        <a th:href="@{'/results/add'}"
           class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
            Add Another
        </a>

        <a th:href="@{'/results/input'}"
           class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg transition">
            View student
        </a>
    </div>
</div>

</body>
</html>
