<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.tymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Student Result</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<!-- HEADER -->
<header class="bg-blue-600 text-white py-4 shadow">

  <div class="max-w-7xl mx-auto px-6 flex justify-between">

    <h1 class="text-2xl font-bold">
      SmartResult Admin
    </h1>

    <nav class="space-x-6">

      <a href="index.html">Home</a>

      <a href="view-result.html">View Result</a>

      <a href="#" class="font-semibold underline">
        Add Result
      </a>

    </nav>

  </div>

</header>



<!-- PAGE TITLE -->
    <div class=" relative mb-30">

  <h2 class="text-3xl font-bold text-center  text-gray-800 mb-8" >
    Add Student Result
  </h2>




<form th:action="@{'/logout'}" method="POST"
   class="absolute top-2 right-2">
    <button type="submit" class="text-white px-3 py-2 bg-blue-700 rounded">Logout</button>

</form>
</div>



<!-- FORM -->
<section class="max-w-5xl mx-auto bg-white shadow-lg rounded-2xl p-8 mb-10">


  <form th:action="@{'/results/process-form'}"
        th:object="${studentForm}"
        method="post"
        id="studentForm"
        class="space-y-8">


    <!-- STUDENT INFO -->
    <h3 class="text-xl font-semibold mb-4 text-blue-600">
      Student Information
    </h3>


    <div class="grid md:grid-cols-2 gap-4">
      <div>

      <input type="text"
             placeholder="Student ID"
             class="border p-3 rounded-lg"
             required>
      </div>

      <div>

      <label class="block mb-1 font-medium text-gray-700">full name</label>

      <input type="text"
             placeholder="Full Name"
             class="border p-3 rounded-lg"
             th:field="*{name}"
      required>
      </div>

    <div>
   <label class="block mb-1 font-medium text-gray-700">RollNumber</label>

   <input type="text"
         placeholder="Roll Number"
             class="border p-3 rounded-lg"
         th:field="*{rollnumber}"
        required>
    </div>

      <div>
      <label class="block mb-1 font-medium text-gray-700">Email</label>

      <input type="email" placeholder="Email"
             class="border p-3 rounded-lg"
             th:field="*{email}"
             required>
      </div>

    <div>
   <label class="block mb-1 font-medium text-gray-700">School name</label>

   <input type="text" placeholder="School Name"
             class="border p-3 rounded-lg"
         th:field="*{schoolname}"
         required>
   </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">dob</label>
        <input type="date"
               th:field="*{dob}"
             class="border p-3 rounded-lg" required>
      </div>


      <div>
        <label class="block mb-1 font-medium text-gray-700">Gender</label>

        <select  th:field="*{gender}" class="border p-3 rounded-lg"

              required>
          <option value="">Select</option>

        <option value="Gender">Gender</option>

        <option value="Male">Male</option>

        <option value="female">Female</option>

        <option value="Other">Other</option>

      </select>


    </div>
    </div>



    <!-- SUBJECT MARKS -->
    <h3 class="text-xl font-semibold mt-8 mb-4 text-blue-600">
      Subject Marks
    </h3>



    <div class="space-y-4 mark_fields_container" id="mark_fields_container">


      <!-- SUBJECT 1 -->

      <div class="grid md:grid-cols-6 gap-4" id="mark_fields_0">

        <input  name="marks[0].subject" placeholder="Subject"
                class="border p-2 rounded-lg">

        <input name="marks[0].marks" type="number" placeholder="Marks"
               class="border p-2 rounded-lg">

        <input name="marks[0].maxMarks" type="number" placeholder="Max Marks"
               class="border p-2 rounded-lg">

        <input  name="marks[0].grade" placeholder="Grade"
                class="border p-2 rounded-lg">

        <input name="marks[0].remark" placeholder="Remark"
               class="border p-2 rounded-lg">

              <button disabled type="button" class="text-white  disabled:bg-gray-300 px-3 py-2 rounded"> remove</button>


      </div>
          <!--      SUBJECT 2-->
      <div class="grid md:grid-cols-6 gap-4" id="mark_fields_1">

        <input  name="marks[1].subject" placeholder="Subject"
                class="border p-2 rounded-lg">

        <input name="marks[1].marks" type="number" placeholder="Marks"
               class="border p-2 rounded-lg">

        <input name="marks[1].maxMarks" type="number" placeholder="Max Marks"
               class="border p-2 rounded-lg">

        <input  name="marks[1].grade" placeholder="Grade"
                class="border p-2 rounded-lg">

        <input name="marks[1].remark" placeholder="Remark"
               class="border p-2 rounded-lg">
              <button disabled type="button" class="text-white disabled:bg-gray-300 px-3 py-2 rounded">Remove</button>


      </div>



    </div>


      <div class="flex justify-center items-center my-5">
          <button onclick="addRow()" type="button" class="text-white bg-orange-700 px-3 py-2 rounded">Add Student marks</button>
      </div>








    <!-- SUBMIT BUTTON -->
    <div class="text-center mt-8">

      <button type="submit"
              class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700">

        Save Student & Results

      </button>

    </div>





  </form>


</section>




<!-- FOOTER -->
<footer class="text-center py-6 text-gray-500">

  © 2026 Smart Result Admin Panel

</footer>
<script>

    let index =2;

    function addRow(){


    const container =document.getElementById("mark_fields_container");
    if(!container){
    console.error("container ID 'mark_fields_container' nahi mili");
    return;
    }
    const htmlContent = `
     <div class="grid md:grid-cols-6 gap-4" id="mark_fields_${index}">

        <input  name="marks[${index}].subject" placeholder="Subject"
                class="border p-2 rounded-lg">

        <input name="marks[${index}].marks" type="number" placeholder="Marks"
               class="border p-2 rounded-lg">

        <input name="marks[${index}].maxMarks" type="number" placeholder="Max Marks"
               class="border p-2 rounded-lg">

        <input  name="marks[${index}].grade" placeholder="Grade"
                class="border p-2 rounded-lg">

        <input name="marks[${index}].remark" placeholder="Remark"
               class="border p-2 rounded-lg">


          <button onclick="removeRow('mark_fields_${index}',${index})" type="button" class="text-white bg-red-700 px-3 py-2 rounded">Remove</button>


      </div>
      `
      container.insertAdjacentHTML('beforeend' , htmlContent);


      //previous row ko nikla sakta ha

      const previousRow =document.getElementById(`mark_fields_${index-1}`)

      const button=previousRow.querySelector("button")
      button.disabled=true;
      button.classList.add("disabled:bg-gray-300","cursor-not-allowed");

     index++;
    }


    function removeRow(divId,index){

   const div =document.getElementById(divId);
   div.parentNode.removeChild(div);


    const previousRow =document.getElementById(`mark_fields_${index-1}`)
     const button=previousRow.querySelector("button")
      button.disabled=false;
      button.classList.add("bg-red-700");
      button.classList.remove("disabled:bg-gray-300", "cursor-not-allowed");


   index--;
    }

</script>




</body>

</html>
