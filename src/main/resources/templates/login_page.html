<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-500 flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">

        <!-- Logo / Heading -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.121 17.804A9 9 0 1118.879 6.196M15 12H9m6 4H9m2-8h2" />
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-800">
                Welcome Back
            </h1>
            <p class="text-gray-500 mt-2">
                Sign in to your account
            </p>
        </div>

        <div th:if="${param.error}" class="mb-4">
            <p class="text-red-500 text-centre">Invalid username or password</p>
        </div>

        <div th:if="${param.logout}" class="mb-4">
            <p class="text-green-500 text-center">Logout Successful ! Login again</p>
        </div>

        <!-- Form -->
        <form th:action="@{'/process-login'}" method="POST" class="space-y-5">

            <!-- Username -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                    Username
                </label>
                <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Enter your username"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-300"
                />
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-300"
                />
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-gray-600">
                    <input type="checkbox" class="rounded text-indigo-600">
                    Remember me
                </label>

                <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg hover:shadow-xl transition duration-300"
            >
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-gray-500 text-sm mt-6">
            Don't have an account?
            <a href="#" class="text-indigo-600 font-semibold hover:text-indigo-800">
                Sign Up
            </a>
        </p>

    </div>
</div>

</body>
</html>
